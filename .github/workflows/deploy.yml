name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web export
        run: npx expo export --platform web
      - name: Fix paths for GitHub Pages subdirectory
        run: |
          sed -i 's|href="/_expo/|href="/wizard-breaker-game/_expo/|g' dist/index.html
          sed -i 's|src="/_expo/|src="/wizard-breaker-game/_expo/|g' dist/index.html
          sed -i 's|href="/favicon.ico"|href="/wizard-breaker-game/favicon.ico"|g' dist/index.html
          # Expo's default web template leaves html/body/#root with no
          # background-color and sizes them with `height: 100%`, which is
          # relative to the layout viewport at load time. Mobile browsers
          # (Safari, in-app webviews like the GitHub app) resize their visual
          # viewport as the address bar/toolbar shows or hides, so that fixed
          # height can fall short of the real screen and expose the browser's
          # default white background above/below the app. Force the reset to
          # use the dynamic viewport height and paint the app's background
          # color so no gap is ever visible.
          sed -i 's|content="width=device-width, initial-scale=1, shrink-to-fit=no"|content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"|' dist/index.html
          sed -i '/<\/head>/i\
          <style>html,body,#root{height:100dvh!important;background-color:#0A0618;overscroll-behavior:none}</style>' dist/index.html
          # Add SPA redirect handler
          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <script>
              sessionStorage.redirect = location.pathname;
            </script>
            <meta http-equiv="refresh" content="0;url=/wizard-breaker-game/index.html">
          </head>
          <body>Loading...</body>
          </html>
          EOF
          # Add redirect handler to index.html
          sed -i '/<\/head>/i\
          <script>\
            var redirect = sessionStorage.redirect;\
            if (redirect) { delete sessionStorage.redirect; history.replaceState(null, "", redirect); }\
          </script>' dist/index.html
      - name: Add PWA manifest and Service Worker
        run: |
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js
          # Add manifest link and service worker registration to index.html
          sed -i '/<\/head>/i\
          <link rel="manifest" href="/wizard-breaker-game/manifest.json">\
          <meta name="theme-color" content="#8B5CF6">\
          <script>\
            if ("serviceWorker" in navigator) {\
              window.addEventListener("load", () => {\
                navigator.serviceWorker.register("/wizard-breaker-game/sw.js").catch(() => {});\
              });\
            }\
          </script>' dist/index.html
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./expo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4